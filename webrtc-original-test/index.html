<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grandstream SDK Original Test</title>
<style>
body{font-family:Tahoma,Arial,sans-serif;background:#F7F3EC;color:#8A6A43;text-align:center;padding:40px 15px}
.box{max-width:520px;margin:auto;border:1px solid #B08D57;border-radius:22px;padding:25px;background:#F7F3EC}
h1{font-size:22px}p{line-height:1.8}
</style>
</head>
<body>
<div class="box">
<h1>اختبار Grandstream SDK الأصلي</h1>
<p>اختبار مباشر للحزمة الأصلية المرفوعة من Grandstream.</p>
</div>
<script src="../anonymousWebRTC/jquery-3.6.0.min.js"></script>
<script>
/* Keep Grandstream SDK untouched. The SDK expects ./anonymousWebRTC/ relative to the host page,
   so load its original launcher text and adjust only those host-relative URLs at runtime. */
fetch('../anonymousWebRTC/webRTC.js',{cache:'no-store'})
 .then(r=>{if(!r.ok)throw new Error('webRTC.js '+r.status);return r.text();})
 .then(code=>{
   code=code.replaceAll('./anonymousWebRTC/','../anonymousWebRTC/');
   code=code.replaceAll('../anonymousWebRTC/webRTC/images/','../anonymousWebRTC/webRTC/images/');
   (0,eval)(code);
 })
 .catch(e=>{console.error(e);document.querySelector('.box').insertAdjacentHTML('beforeend','<p>تعذر تحميل SDK: '+e.message+'</p>');});
</script>
</body>
</html>
