<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Room Caller ID Test</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#f7f3eb;font-family:Arial,sans-serif;overflow:hidden}
    .label{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:20;background:#fff;padding:8px 14px;border-radius:20px;box-shadow:0 2px 12px #0002;font-weight:700;color:#5a4632}
    #anonymousWebRTC{display:block;position:fixed;right:100px;bottom:0;width:400px;height:280px;z-index:10;background:#fff;box-shadow:0 0 10px #ccc}
    #frameDialog{display:block;width:100%;height:100%;border:0}
    @media(max-width:600px){#anonymousWebRTC{right:0!important;width:100%!important}.label{top:8px}}
  </style>
</head>
<body>
  <div class="label" id="roomLabel">ROOM TEST</div>
  <div id="anonymousWebRTC" class="main-box">
    <iframe id="frameDialog" name="frameDialog" src="./webRTC.html" allow="microphone; autoplay" scrolling="no" title="WebRTC test"></iframe>
  </div>
  <script>
    const room=(new URLSearchParams(location.search).get('room')||'1205').replace(/[^0-9A-Za-z_-]/g,'');
    document.getElementById('roomLabel').textContent='ROOM '+room+' TEST';
    const frame=document.getElementById('frameDialog');
    frame.addEventListener('load',()=>{
      const start=()=>{
        try{
          if(frame.contentWindow && typeof frame.contentWindow.startDevice==='function'){
            frame.contentWindow.startDevice();
          }else{
            setTimeout(start,250);
          }
        }catch(e){console.error('WebRTC test init:',e);}
      };
      start();
    });
  </script>
</body>
</html>
