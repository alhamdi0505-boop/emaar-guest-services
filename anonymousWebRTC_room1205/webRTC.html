<div id="diagPanel" style="position:fixed;left:6px;right:6px;top:6px;z-index:99999;background:#111;color:#0f0;font:11px/1.35 monospace;padding:6px;max-height:120px;overflow:auto;opacity:.92;white-space:pre-wrap">DIAG: loaded</div>
<script>
(function(){
  const p=()=>document.getElementById('diagPanel');
  const out=(lvl,args)=>{
    try{
      const line='['+lvl+'] '+Array.from(args).map(v=>{
        try{return typeof v==='string'?v:JSON.stringify(v);}catch(e){return String(v);}
      }).join(' ');
      const el=p(); if(el){el.textContent += '\n'+line; el.scrollTop=el.scrollHeight;}
    }catch(e){}
  };
  ['log','warn','error'].forEach(k=>{
    const orig=console[k].bind(console);
    console[k]=function(){out(k,arguments);orig(...arguments);}
  });
  window.addEventListener('error',e=>out('window.error',[e.message,e.filename,e.lineno]));
  window.addEventListener('unhandledrejection',e=>out('promise.reject',[String(e.reason)]));
  const NativeWS=window.WebSocket;
  window.WebSocket=function(url,protocols){
    out('WS:new',[url]);
    const ws=protocols===undefined?new NativeWS(url):new NativeWS(url,protocols);
    ws.addEventListener('open',()=>out('WS:open',[url]));
    ws.addEventListener('error',()=>out('WS:error',[url]));
    ws.addEventListener('close',e=>out('WS:close',[e.code,e.reason]));
    return ws;
  };
  window.WebSocket.prototype=NativeWS.prototype;
  Object.setPrototypeOf(window.WebSocket,NativeWS);
})();
</script>
