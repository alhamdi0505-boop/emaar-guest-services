<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#F7F3EC"><title>EMAAR WebRTC Test</title>
<style>
:root{--cream:#F7F3EC;--gold:#B08D57;--brown:#8A6A43}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--cream);font-family:Tahoma,Arial,sans-serif;color:var(--brown);display:flex;align-items:center;justify-content:center;padding:20px}.box{width:min(520px,100%);text-align:center;border:1px solid var(--gold);border-radius:28px;padding:28px 22px;box-shadow:0 14px 34px rgba(138,106,67,.14)}.logo{width:min(430px,96%);display:block;margin:0 auto 12px;mix-blend-mode:multiply}h1{font-size:24px;margin:8px 0}.sub{line-height:1.8;margin:0 0 20px}.call{display:block;width:100%;border:1px solid var(--gold);border-radius:18px;background:var(--brown);color:var(--cream);padding:18px;font-size:18px;font-weight:bold;cursor:pointer}.status{margin-top:15px;font-size:13px}.note{font-size:11px;line-height:1.7;margin-top:18px}code{font-size:11px}</style>
</head><body><main class="box"><img src="../logo.png" class="logo" alt="EMAAR AL DIYAFA HOTELS"><h1>تجربة اتصال WebRTC</h1><p class="sub">صفحة اختبار مستقلة — لا تؤثر على صفحة خدمات النزلاء الحالية.</p><button class="call" id="call">☎ بدء تجربة الاتصال</button><div class="status" id="status">جاهز للاختبار</div><p class="note">المرحلة الأولى تختبر فتح Click2Call الحالي من واجهة إعمار المنفصلة. بعد التحقق سنحمّل SDK داخل هذا المسار ونستبدل واجهة الاتصال الأصلية.</p></main><script>document.getElementById('call').onclick=function(){document.getElementById('status').textContent='جاري فتح اتصال الاختبار…';location.href='https://emaargrand.a.gdms.cloud/click2call?from_user=webrtc_trunk_1&to_user=service';};</script></body></html>
