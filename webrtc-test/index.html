<!doctype html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#F7F3EC"><title>EMAAR WebRTC Test</title>
<style>
:root{--cream:#F7F3EC;--gold:#B08D57;--brown:#8A6A43}*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--cream);font-family:Tahoma,Arial,sans-serif;color:var(--brown);display:flex;align-items:center;justify-content:center;padding:20px}.box{width:min(520px,100%);text-align:center;border:1px solid var(--gold);border-radius:28px;padding:28px 22px;box-shadow:0 14px 34px rgba(138,106,67,.14)}.logo{width:min(430px,96%);display:block;margin:0 auto 12px;mix-blend-mode:multiply}h1{font-size:24px;margin:8px 0}.sub{line-height:1.8;margin:0 0 20px}.call{display:block;width:100%;border:1px solid var(--gold);border-radius:18px;background:var(--brown);color:var(--cream);padding:18px;font-size:18px;font-weight:bold;cursor:pointer}.call:disabled{opacity:.55;cursor:wait}.status{font-size:12px;margin-top:12px}#anonymousWebRTC{display:none;position:fixed;z-index:99;inset:50% auto auto 50%;transform:translate(-50%,-50%);width:min(400px,94vw);height:280px;background:var(--cream);border-radius:20px;overflow:hidden;box-shadow:0 18px 55px rgba(138,106,67,.28)}iframe{width:100%;height:100%;border:0}.note{font-size:11px;line-height:1.7;margin-top:18px}</style></head><body>
<main class="box"><img src="../logo.png" class="logo" alt="EMAAR AL DIYAFA HOTELS"><h1>تجربة اتصال WebRTC</h1><p class="sub">اتصال مباشر من داخل واجهة إعمار — وضع التشخيص مفعّل.</p><button class="call" id="startCall" disabled>جاري تجهيز الاتصال…</button><div class="status" id="status">تحميل WebRTC SDK</div><p class="note">بعد التجربة افتح Console وابحث عن EMAAR-DIAG.</p></main><div id="anonymousWebRTC"><iframe id="frameDialog" name="frameDialog" allow="microphone; autoplay"></iframe></div>
<script>
(async()=>{const btn=document.getElementById('startCall'),status=document.getElementById('status'),frame=document.getElementById('frameDialog');try{const urls=Array.from({length:10},(_,i)=>'./chunks/part'+String(i).padStart(2,'0')+'.txt');const parts=await Promise.all(urls.map(u=>fetch(u,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(u+' '+r.status);return r.text()})));let sdkHtml=parts.join('');
/* Diagnostic hooks are inserted into the SDK source before srcdoc execution. */
sdkHtml=sdkHtml.replace(/sipCall\((\{[\s\S]{0,1200}?peerAccount[\s\S]{0,1200}?\})\)/g,'(console.warn("EMAAR-DIAG sipCall args:",$1),sipCall($1))');
sdkHtml=sdkHtml.replace(/sipCallInit\(([^;]{1,1800})\)/g,'(console.warn("EMAAR-DIAG sipCallInit args:",$1),sipCallInit($1))');
sdkHtml=sdkHtml.replace(/console\.log\(([^)]*sip_call[^)]*)\)/gi,'console.warn("EMAAR-DIAG sip callback:",$1)');
const workerPrefix="var sessionStorage={_d:{},getItem:function(k){return Object.prototype.hasOwnProperty.call(this._d,k)?this._d[k]:null;},setItem:function(k,v){this._d[k]=String(v);},removeItem:function(k){delete this._d[k];},clear:function(){this._d={};}};var localStorage=sessionStorage;\n";const blobMarker="new Blob([atob('";if(sdkHtml.includes(blobMarker)){sdkHtml=sdkHtml.replace(blobMarker,"new Blob(["+JSON.stringify(workerPrefix)+"+atob('");}else throw new Error('WebRTC worker marker not found');const px='data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=';sdkHtml=sdkHtml.replaceAll('./webRTC/images/close.png',px).replaceAll('./webRTC/images/reload-image.png',px).replaceAll('./webRTC/images/reload-icon.png',px).replaceAll('./webRTC/images/calling-icon.png',px).replaceAll('webRTC/images/call-btn-icon.png',px).replaceAll('webRTC/images/hangup-icon.png',px);frame.srcdoc=sdkHtml;frame.onload=()=>{btn.disabled=false;btn.textContent='☎ بدء الاتصال';status.textContent='جاهز للاختبار';console.warn('EMAAR-DIAG iframe loaded');};btn.onclick=()=>{document.getElementById('anonymousWebRTC').style.display='block';status.textContent='جاري تجهيز الاتصال…';const w=frame.contentWindow,d=frame.contentDocument||(w&&w.document);console.warn('EMAAR-DIAG settings expected',{realm:'Grandstream',impi:'webrtc_anonymous',phone_number:'click2call',websocket_proxy_url:'emaargrand.a.gdms.cloud'});if(!(w&&typeof w.startDevice==='function')){status.textContent='SDK لم يجهز بعد، حاول مرة ثانية.';return;}w.startDevice();setTimeout(()=>{try{const b=d&&d.querySelector('.bottom-call-btn');if(b){status.textContent='جاري الاتصال…';console.warn('EMAAR-DIAG pressing SDK call button');b.click();}else status.textContent='زر الاتصال داخل SDK غير جاهز.';}catch(e){status.textContent='تعذر بدء الاتصال.';console.error('EMAAR-DIAG call error',e);}},1800);};}catch(e){status.textContent='تعذر تحميل SDK: '+e.message;btn.textContent='تعذر التجهيز';console.error(e);}})();
</script></body></html>
